services:
  web:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /Regen
    ports:
      - '5050:80'
    environment:
      ASPNETCORE_URLS: http://+:80
      DOTNET_USE_POLLING_FILE_WATCHER: 'true'
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      PATH: /root/.dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - .:/Regen
      - regen-nuget:/root/.nuget/packages
      - regen-bin:/Regen/bin
      - regen-obj:/Regen/obj
      - regen-dotnet-home:/root/.dotnet
      - regen-data:/Regen/data
    command: dotnet watch run --non-interactive --no-launch-profile
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: regen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: regen
    volumes:
      - regen-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U regen -d regen']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  regen-nuget:
  regen-bin:
  regen-obj:
  regen-dotnet-home:
  regen-postgres-data:
  regen-data:
