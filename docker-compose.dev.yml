services:
  web:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /Regen
    ports:
      - '5050:80'
    environment:
      ConnectionStrings__RegenContext: 'Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}'
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      DOTNET_USE_POLLING_FILE_WATCHER: 'true'
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Admin__GoogleId: ${ADMIN_GOOGLE_ID}
      OpenAI__ApiKey: ${OPENAI_APIKEY}
      Security__CreditClaimKey: ${CREDIT_CLAIM_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${WEBHOOK_SECRET_KEY}
      PATH: /root/.dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - .:/Regen
      - regen-nuget:/root/.nuget/packages
      - regen-bin:/Regen/bin
      - regen-obj:/Regen/obj
      - regen-dotnet-home:/root/.dotnet
      - regen-data:/Regen/data
      - ./logs:/Regen/logs
    command: dotnet watch run --non-interactive --no-launch-profile
    depends_on:
      - db
      - seq

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: regen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: regen
    volumes:
      - regen-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U regen -d regen']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  seq:
    image: datalust/seq:latest
    container_name: regen-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:5341:80'
    volumes:
      - seq-data:/data
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  regen-nuget:
  regen-bin:
  regen-obj:
  regen-dotnet-home:
  regen-postgres-data:
  regen-data:
  seq-data:
  uptime-kuma-data:
